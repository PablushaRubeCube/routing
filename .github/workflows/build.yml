name: Build VPN routing data

on:
  push:
    paths:
      - "data/**"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Clone domain-list-community
        run: |
          git clone --depth 1 \
            https://github.com/v2fly/domain-list-community.git \
            /tmp/dlc

      - name: Build domain rules
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"

          cd /tmp/dlc
          go mod download

          go run ./ \
            --datapath="${GITHUB_WORKSPACE}/data" \
            --outputname="my-routes.dat" \
            --outputdir="${GITHUB_WORKSPACE}/dist"

      - name: Remove obsolete Telegram files
        run: |
          rm -f dist/telegram-ip.dat
          rm -f dist/telegram-cidr.txt

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A dist

          if git diff --cached --quiet; then
            echo "No routing changes"
            exit 0
          fi

          git commit -m "Update VPN routing data"
          git push origin HEAD:${GITHUB_REF_NAME}