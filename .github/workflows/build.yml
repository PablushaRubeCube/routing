name: Build routing dat

on:
  push:
    paths:
      - "data/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get domain-list-community builder
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git /tmp/dlc

      - name: Build my-routes.dat
        run: |
          mkdir -p dist
          cd /tmp/dlc
          go mod download
          go run ./ \
            --datapath="${GITHUB_WORKSPACE}/data" \
            --outputname="my-routes.dat" \
            --outputdir="${GITHUB_WORKSPACE}/dist"

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/my-routes.dat

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Build my-routes.dat"
          git push origin HEAD:${GITHUB_REF_NAME}
